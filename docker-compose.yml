services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: storage
      POSTGRES_PASSWORD: storage
      POSTGRES_DB: storage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storage"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: distributed-storage
    ports:
      - "8080:8080"
    environment:
      DB_URL: "postgres://storage:storage@postgres:5432/storage?sslmode=disable"
      MAX_UPLOAD_SIZE_MB: "100"
      
    depends_on:
      postgres:
        condition: service_healthy

  storage_node:
    build: .
    container_name: storage-node
    command: /app/storage-node
    ports:
      - "8081:8081"
    volumes:
      - file_storage:/app/storage

volumes:
  postgres_data:
  file_storage: