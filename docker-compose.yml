services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: storage
      POSTGRES_PASSWORD: storage
      POSTGRES_DB: storage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storage"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: distributed-storage
    ports:
      - "8080:8080"
    environment:
      DB_URL: "postgres://storage:storage@postgres:5432/storage?sslmode=disable"
    volumes:
      - file_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  file_storage: